[package]
name = "mc1322x-embassy"
version = "0.1.0"
edition = "2024"
description = "Embassy platform support for the NXP MC1322x"

[package.metadata.docs.rs]
all-features = true

[dependencies]
critical-section = { version = "1.2", features = ["restore-state-u32"] }
defmt = { version = "1.0", optional = true }
embassy-executor = { version = "0.10", features = ["portable-atomic"] }
embassy-time = { version = "0.5", features = [
  "generic-queue-16",
  "tick-hz-1_000",
] }
embassy-time-driver = { version = "0.2", features = ["tick-hz-1_000"] }
embassy-time-queue-utils = { version = "0.3", features = ["generic-queue-16"] }
heapless = { version = "0.9", features = ["portable-atomic-critical-section"] }
mc1322x-hal = { path = "../mc1322x-hal" }
mc1322x-sys = { path = "../mc1322x-sys" }
portable-atomic = { version = "1.5", features = ["critical-section"] }
task-watchdog = { version = "0.1.2", default-features = false, optional = true }

[features]
defmt = ["dep:defmt", "embassy-time/defmt"]
# `sleepy_executor::SleepyExecutor`. It registers its own `Pender` (`__pender`), so it can't be
# combined with any `embassy-executor` `platform-*` feature (e.g. `platform-spin`) in one binary.
sleepy-executor = []
# `task_watchdog`: multiplexes several tasks' liveness onto the COP hardware watchdog.
task-watchdog = ["dep:task-watchdog", "mc1322x-hal/task-watchdog"]
