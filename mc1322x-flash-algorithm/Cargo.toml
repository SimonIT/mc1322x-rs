[workspace]

[package]
name = "mc1322x-flash-algorithm"
version = "0.1.0"
authors = ["SimonIT"]
edition = "2021"
description = "Flash algorithm for Freescale/NXP MC1322x (MC13224V, MC13226V)"

[[bin]]
name = "mc1322x-flash-algorithm"
test = false
bench = false

[dependencies]
flash-algorithm = { version = "0.7.0", features = ["verify"] }

[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true
panic = "abort"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = 's'
overflow-checks = false
panic = "abort"

[profile.dev.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

[profile.release.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false
