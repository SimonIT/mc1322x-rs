[build]
target = "thumbv4t-none-eabi"

[unstable]
build-std = ["core"]

[target.thumbv4t-none-eabi]
rustflags = [
  "-Clinker=arm-none-eabi-ld",                       # uses the ARM linker
  "-Clink-arg=-Tmc1322x-sys/libmc1322x/mc1322x.lds", # sets the link script
  # Real 32-bit integer division from libgcc. `compiler_builtins` always links a weak
  # `__aeabi_*` div/mod definition that crashes on this core, and a plain `-lgcc` never gets to
  # override it, so these Thumb objects are linked directly. libgcc's 64-bit helpers are left
  # out on purpose: they are ARM code needing a `BLX` veneer, which ARMv4T lacks;
  # `compiler_builtins`' 64-bit division is used instead. `mc1322x-sys`'s build script extracts
  # the objects from the installed toolchain's `libgcc.a` into `.libgcc-thumbv4t/`.
  "-Clink-arg=.libgcc-thumbv4t/_udivsi3.o",
  "-Clink-arg=.libgcc-thumbv4t/_divsi3.o",
  # `__aeabi_idiv0`, called on division by zero by the objects above.
  "-Clink-arg=.libgcc-thumbv4t/_dvmd_tls.o",
  # Thumb-1 `switch` jump-table helpers used by libmc1322x: `_uqi` by `lib/pwm.c`, `_sqi` by
  # `lib/printf.c`. The other `__gnu_thumb1_case_*` variants are unused; add them here and in
  # `mc1322x-sys/build.rs` if a link error asks for one.
  "-Clink-arg=.libgcc-thumbv4t/_thumb1_case_uqi.o",
  "-Clink-arg=.libgcc-thumbv4t/_thumb1_case_sqi.o",
]
