[package]
name = "mc1322x-hal"
version = "0.1.0"
edition = "2024"
description = "HAL for the NXP/Freescale MC1322x chip family (MC13224V/MC13226V)"

[[test]]
name = "embedded_test"
harness = false

[dependencies]
bitflags = "2"
critical-section = { version = "1.2", features = ["restore-state-u32"] }
embedded-cal = "0.2.0-alpha.1"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-io = "0.7.0"
embedded-io-async = "0.7.0"
embedded-storage = "0.3.1"
embedded-time = { version = "0.12.1", optional = true }
fugit = { version = "0.5.0", optional = true }
mc1322x-sys = { path = "../mc1322x-sys" }
portable-atomic = { version = "1.5", features = ["critical-section"] }
rand_core = { version = "0.10.1", default-features = false }
task-watchdog = { version = "0.1.2", default-features = false, optional = true }


[dev-dependencies]
embedded-test = { version = "0.7.2", default-features = false, features = [
  "panic-handler",
  "semihosting",
] }
embedded-test-linker-script = "0.1.0"

[features]
default = ["board-redbee-econotag"]
board-redbee-econotag = []
fugit = ["dep:fugit"]
embedded-time = ["dep:embedded-time"]
task-watchdog = ["dep:task-watchdog"]
